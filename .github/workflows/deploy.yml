# Deploys to Vercel on every push to main, whoever pushed it.
# Needs the repo secret VERCEL_TOKEN and the repo variables VERCEL_ORG_ID / VERCEL_PROJECT_ID.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the VERCEL_TOKEN repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - run: npm install --global vercel@63.1.2
      - name: Deploy to production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
